[workspace]
resolver = "2"
members = ["crates/core", "crates/ipc", "crates/persistence", "crates/provider-native", "crates/provider-container", "crates/orchestrator", "crates/daemon", "examples/hello-http", "apps/desktop/src-tauri"]
default-members = ["crates/daemon", "examples/hello-http"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
dockon-core = { path = "crates/core" }
dockon-ipc = { path = "crates/ipc" }
dockon-persistence = { path = "crates/persistence" }
dockon-provider-native = { path = "crates/provider-native" }
dockon-provider-container = { path = "crates/provider-container" }
dockon-orchestrator = { path = "crates/orchestrator" }
